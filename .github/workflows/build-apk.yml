name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK with Capacitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Initialize or Sync Capacitor Android
        run: |
          if [ ! -d "android" ] || [ ! -f "android/gradlew" ]; then
            echo "Plataforma Android no detectada o incompleta. Creando con Capacitor..."
            npx cap add android || true
          fi
          npx cap sync android
          # Asegurar compatibilidad de SDK Android 15
          if [ -f "android/variables.gradle" ]; then
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/g' android/variables.gradle
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/g' android/variables.gradle
          fi
          # Generar wrapper si hace falta y otorgar permisos
          if [ ! -f "android/gradlew" ]; then
            cd android && gradle wrapper && cd ..
          fi
          chmod +x android/gradlew || true

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agroanalisis-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
